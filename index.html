<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FBI Secure Database</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="login">

<h2>FBI LOGIN</h2>

<input id="user" placeholder="Login">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

<div id="app">

<header>

<h1>FBI DATABASE</h1>

<nav>

<button onclick="showPage('agents')">Agents</button>
<button onclick="showPage('cases')">Cases</button>

</nav>

</header>

<section id="agents">

<h2>Agents</h2>

<input id="agentName" placeholder="Agent name">

<select id="agentRank">
<option>Agent</option>
<option>Senior Agent</option>
<option>Inspector</option>
</select>

<select id="agentDivision">
<option>CID</option>
<option>HRT</option>
<option>IA</option>
</select>

<button onclick="addAgent()">Add Agent</button>

<table id="agentTable">

<tr>
<th>ID</th>
<th>Name</th>
<th>Rank</th>
<th>Division</th>
<th>Delete</th>
</tr>

</table>

</section>

<section id="cases">

<h2>Cases</h2>

<input id="caseName" placeholder="Case name">
<input id="caseAgent" placeholder="Agent">

<button onclick="addCase()">Add Case</button>

<table id="caseTable">

<tr>
<th>ID</th>
<th>Case</th>
<th>Agent</th>
<th>Delete</th>
</tr>

</table>

</section>

</div>

<script src="script.js"></script>

</body>
</html>
